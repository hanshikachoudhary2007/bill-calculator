<!DOCTYPE html>
<html>
<head>
    <title>Bill Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Bill Calculator</h2>

<table id="billTable">
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Rate</th>
        <th>Amount</th>
    </tr>

    <tr>
        <td><input type="text" placeholder="Item Name"></td>
        <td><input type="number" class="qty"></td>
        <td><input type="number" class="rate"></td>
        <td class="amount">0.00</td>
    </tr>
</table>

<button onclick="addRow()">Add Item</button>

<br><br>

<label><b>Less % :</b></label>
<input type="number" id="discount" value="0" style="width:100px;">

<button onclick="calculateBill()">Calculate</button>
<button onclick="clearAll()">Clear</button>

<div id="result"></div>

<script>

function addRow() {
    let table = document.getElementById("billTable");

    let row = table.insertRow();

    row.innerHTML = `
        <td><input type="text" placeholder="Item Name"></td>
        <td><input type="number" class="qty"></td>
        <td><input type="number" class="rate"></td>
        <td class="amount">0.00</td>
    `;
}

function calculateBill() {

    let qtys = document.querySelectorAll(".qty");
    let rates = document.querySelectorAll(".rate");
    let amounts = document.querySelectorAll(".amount");

    let subtotal = 0;

    for(let i=0;i<qtys.length;i++) {

        let qty = parseFloat(qtys[i].value) || 0;
        let rate = parseFloat(rates[i].value) || 0;

        let amount = qty * rate;

        amounts[i].innerText = amount.toFixed(2);

        subtotal += amount;
    }

    let less = parseFloat(document.getElementById("discount").value) || 0;

    let discountAmount = subtotal * less / 100;

    let finalAmount = subtotal - discountAmount;

    document.getElementById("result").innerHTML =
        `
        Subtotal : ₹${subtotal.toFixed(2)}<br>
        Discount : ₹${discountAmount.toFixed(2)}<br>
        Final Bill : ₹${finalAmount.toFixed(2)}
        `;
}

function clearAll() {

    location.reload();
}

</script>

</body>
</html>
